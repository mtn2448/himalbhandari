<head>
    <meta charset="UTF-8">

    <title>For Goma ❤️ from Himal</title>
    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            background: radial-gradient(ellipse at 30% 20%, #0a0515 0%, #0d081a 40%, #050108 100%);
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* ============================================================
           ANIMATED BACKGROUND ORBS
        ============================================================ */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 25s infinite ease-in-out;
        }

        .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: rgba(180, 80, 255, 0.06);
            top: -20%;
            left: -15%;
            animation-delay: 0s;
        }
        .orb:nth-child(2) {
            width: 600px;
            height: 600px;
            background: rgba(255, 100, 200, 0.05);
            bottom: -30%;
            right: -20%;
            animation-delay: -8s;
        }
        .orb:nth-child(3) {
            width: 400px;
            height: 400px;
            background: rgba(100, 150, 255, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
        }
        .orb:nth-child(4) {
            width: 300px;
            height: 300px;
            background: rgba(255, 150, 200, 0.04);
            top: 15%;
            right: 5%;
            animation-delay: -5s;
        }
        .orb:nth-child(5) {
            width: 350px;
            height: 350px;
            background: rgba(150, 100, 255, 0.04);
            bottom: 10%;
            left: 5%;
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            25% {
                transform: translate(50px, -50px) scale(1.15) rotate(8deg);
            }
            50% {
                transform: translate(-40px, 40px) scale(0.85) rotate(-5deg);
            }
            75% {
                transform: translate(40px, 50px) scale(1.1) rotate(6deg);
            }
        }

        /* ============================================================
           FLOATING SPARKLES
        ============================================================ */
        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            border-radius: 50%;
            animation: sparkleFloat var(--duration) infinite linear;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        /* ============================================================
           MAIN CARD
        ============================================================ */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(15, 8, 20, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 80px 80px 50px 50px;
            padding: 2rem 2rem 2.8rem;
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(200, 150, 255, 0.1);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(200, 150, 255, 0.05),
                0 0 120px rgba(150, 80, 255, 0.03);
            text-align: center;
            animation: cardFloat 8s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200, 150, 255, 0.3), transparent);
            border-radius: 50%;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 150, 255, 0.15), transparent);
            border-radius: 50%;
        }

        /* ============================================================
           LOTUS CONTAINER
        ============================================================ */
        .lotus-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin: 0 auto 15px;
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================================
           LOTUS - PURE CSS WITH ANIMATION
        ============================================================ */
        .lotus {
            position: relative;
            width: 340px;
            height: 340px;
            animation: lotusFloat 8s ease-in-out infinite;
        }

        @keyframes lotusFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-1deg) scale(1);
            }
            50% {
                transform: translateY(-15px) rotate(1deg) scale(1.02);
            }
        }

            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            opacity: 0.92;
            box-shadow: inset -3px -3px 20px rgba(0, 0, 0, 0.15),

                transform: rotate(var(--rot)) scale(1) translateY(0);

            100% {

        /* --- CENTER BUD - Golden glow --- */

        .bud-l::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 200, 0.4);
            font-size: 14px;
            animation: budSparkleL 2.5s ease-in-out infinite;
        }

        .bud-l::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.15), transparent);

            animation: centerGlowL 3s ease-in-out infinite;

        @keyframes budSparkleL {

        @keyframes centerGlowL {

        @keyframes leafFloatL {

<body>

    <!-- ============================================================
    BACKGROUND ORBS
    ============================================================ -->
    <div class="bg-orbs">

    <!-- ============================================================

    ============================================================ -->

    <!-- ============================================================
    MAIN CARD
    ============================================================ -->

        <!-- ===== LOTUS ===== -->
        <div class="lotus-container">
            <div class="flower-glow"></div>

                <!-- Outer petals (8) -->

                <div class="petal-l petal-c3"></div>
                <div class="petal-l petal-c4"></div>

            <strong>Goma</strong>, like this lotus blooms pure and bright,<br>
            my love for you shines with eternal light. <span class="emoji-float">🪷</span><br>

            <span>🪷 Forever & Always 🪷</span>

        </div>
    </div>

    <script>
        // ============================================================
        // CREATE SPARKLES
        // ============================================================
        function createSparkles() {
            const container = document.getElementById('sparkles');
            const symbols = ['✦', '✧', '•', '◦', '☆', '·'];
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.className = 'sparkle';
                const size = 2 + Math.random() * 6;
                const duration = 14 + Math.random() * 20;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.left = Math.random() * 100 + '%';
                el.style.setProperty('--duration', duration + 's');
                el.style.animationDelay = Math.random() * 18 + 's';
                const colors = [
                    `rgba(200, ${150 + Math.random() * 100}, 255, ${0.3 + Math.random() * 0.4})`,
                    `rgba(255, ${150 + Math.random() * 100}, ${200 + Math.random() * 55}, ${0.3 + Math.random() * 0.4})`,
                    `rgba(${200 + Math.random() * 55}, ${150 + Math.random() * 100}, 255, ${0.3 + Math.random() * 0.4})`
                ];
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.boxShadow = `0 0 ${10 + Math.random() * 20}px ${3 + Math.random() * 6}px ${colors[0]}`;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.textContent = Math.random() > 0.7 ? symbols[Math.floor(Math.random() * symbols.length)] : '';
                el.style.fontSize = (6 + Math.random() * 10) + 'px';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                container.appendChild(el);
            }
        }
        createSparkles();

        // ============================================================
        // PROPOSAL FUNCTION
        // ============================================================
        function propose() {
            alert('💖 Yes! Goma said YES! 💖\n\n— Himal will love you forever and always! 🪷❤️');

            // Celebration burst
            const emojis = ['❤️', '💖', '💕', '💗', '💓', '💘', '🌸', '✨', '🌟', '🎉', '💝', '🪷', '🌺', '💐', '🎊', '🌷'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.style.position = 'fixed';
                    el.style.pointerEvents = 'none';
                    el.style.zIndex = '9999';
                    el.style.fontSize = (1.5 + Math.random() * 4.5) + 'rem';
                    el.style.left = (10 + Math.random() * 80) + '%';
                    el.style.top = (10 + Math.random() * 80) + '%';
                    el.style.transition = 'all 3.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.opacity = '1';
                    el.style.filter = 'drop-shadow(0 0 30px rgba(200,150,255,0.3))';
                    el.style.transform = 'scale(1) rotate(0deg)';
                    document.body.appendChild(el);

                    const tx = (Math.random() - 0.5) * 900;
                    const ty = -600 - Math.random() * 700;
                    const rot = (Math.random() - 0.5) * 720;
                    setTimeout(() => {
                        el.style.transform = `translate(${tx}px, ${ty}px) scale(0) rotate(${rot}deg)`;
                        el.style.opacity = '0';
                    }, 50);

                    setTimeout(() => el.remove(), 3500);
                }, i * 35);
            }
        }
    </script>
