<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Goma ❤️ from Himal</title>
    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            background: radial-gradient(ellipse at 30% 20%, #1a0a1a 0%, #0d050d 50%, #050105 100%);
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* ============================================================
           ANIMATED BACKGROUND ORBS
        ============================================================ */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: orbFloat 20s infinite ease-in-out;
        }

        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: rgba(255, 180, 50, 0.08);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: rgba(255, 100, 50, 0.06);
            bottom: -25%;
            right: -15%;
            animation-delay: -7s;
        }
        .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: rgba(255, 200, 50, 0.05);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }
        .orb:nth-child(4) {
            width: 250px;
            height: 250px;
            background: rgba(255, 150, 50, 0.04);
            top: 20%;
            right: 5%;
            animation-delay: -4s;
        }
        .orb:nth-child(5) {
            width: 300px;
            height: 300px;
            background: rgba(255, 100, 50, 0.04);
            bottom: 10%;
            left: 5%;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            25% {
                transform: translate(40px, -40px) scale(1.1) rotate(5deg);
            }
            50% {
                transform: translate(-30px, 30px) scale(0.9) rotate(-3deg);
            }
            75% {
                transform: translate(30px, 40px) scale(1.05) rotate(4deg);
            }
        }

        /* ============================================================
           FLOATING SPARKLES
        ============================================================ */
        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            border-radius: 50%;
            animation: sparkleFloat var(--duration) infinite linear;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        /* ============================================================
           MAIN CARD
        ============================================================ */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(20, 8, 18, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 80px 80px 50px 50px;
            padding: 2rem 2rem 2.8rem;
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(255, 200, 150, 0.1);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 200, 150, 0.05),
                0 0 100px rgba(255, 150, 50, 0.03);
            text-align: center;
            animation: cardFloat 8s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 200, 150, 0.3), transparent);
            border-radius: 50%;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 200, 150, 0.15), transparent);
            border-radius: 50%;
        }

        /* ============================================================
           MARIGOLD CONTAINER
        ============================================================ */
        .marigold-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin: 0 auto 15px;
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================================
           MARIGOLD - PURE CSS WITH ANIMATION
        ============================================================ */
        .marigold {
            position: relative;
            width: 340px;
            height: 340px;
            animation: flowerFloat 7s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg) scale(1);
            }
            50% {
                transform: translateY(-18px) rotate(2deg) scale(1.02);
            }
        }

        /* --- PETAL BASE --- */
        .petal-m {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            opacity: 0.92;
            box-shadow: inset -2px -2px 15px rgba(0, 0, 0, 0.15),
                inset 2px 2px 15px rgba(255, 200, 100, 0.1),
                0 0 20px rgba(255, 150, 50, 0.05);
            animation: petalSway var(--sway-duration, 4s) ease-in-out infinite alternate;
        }

        @keyframes petalSway {
            0% {
                transform: rotate(var(--rot)) scale(1) translateY(0);
            }
            100% {
                transform: rotate(var(--rot)) scale(1.03) translateY(-2px);
            }
        }

        /* --- CENTER BUD - Marigold characteristic dark center --- */

            position: absolute;

            height: 45px;
            background: radial-gradient(circle at 40% 30%, #8B4513, #5a2a0a, #3a1a05);

            animation: budPulseM 3s ease-in-out infinite;
            z-index: 10;
        }

        .bud-m::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 200, 100, 0.3);
            font-size: 16px;
            animation: budSparkleM 2s ease-in-out infinite;
        }

        .bud-m::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.2), transparent);
            border-radius: 50%;
            animation: centerGlow 2.5s ease-in-out infinite;
        }

        @keyframes budPulseM {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 50px rgba(139, 69, 19, 0.4);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 80px rgba(139, 69, 19, 0.7), 0 0 120px rgba(255, 150, 50, 0.15);
            }
        }

        @keyframes budSparkleM {
            0%,
            100% {
                opacity: 0.2;
                transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
            }
            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.3) rotate(180deg);
            }
        }

        @keyframes centerGlow {

            100% {

                opacity: 0.3;

            50% {

        /* --- STEM --- */
        .stem-m {

            z-index: -1;
        }

        .stem-m::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 15px;
            width: 35px;
            height: 15px;
            background: linear-gradient(135deg, #2a8a3a, #1a5a2a);
            border-radius: 0 50% 50% 0;
            transform: rotate(-35deg);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            animation: leafSwayLeftM 4s ease-in-out infinite alternate;
        }

        .stem-m::after {
            content: '';
            position: absolute;
            right: -18px;
            top: 38px;
            width: 35px;
            height: 15px;
            background: linear-gradient(225deg, #2a8a3a, #1a5a2a);

            transform: rotate(35deg);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);

        .stem-m .leaf-extra-m {

            height: 12px;
            border-radius: 0 50% 50% 0;

    <script>
        // ============================================================
        // CREATE SPARKLES
        // ============================================================
        function createSparkles() {
            const container = document.getElementById('sparkles');
            const symbols = ['✦', '✧', '•', '◦', '☆', '·'];
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.className = 'sparkle';
                const size = 2 + Math.random() * 6;
                const duration = 14 + Math.random() * 20;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.left = Math.random() * 100 + '%';
                el.style.setProperty('--duration', duration + 's');
                el.style.animationDelay = Math.random() * 18 + 's';
                const colors = [
                    `rgba(255, ${180 + Math.random() * 75}, ${50 + Math.random() * 50}, ${0.3 + Math.random() * 0.4})`,
                    `rgba(255, ${200 + Math.random() * 55}, ${100 + Math.random() * 50}, ${0.3 + Math.random() * 0.4})`,
                    `rgba(255, ${150 + Math.random() * 100}, ${50 + Math.random() * 50}, ${0.3 + Math.random() * 0.4})`
                ];
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.boxShadow = `0 0 ${10 + Math.random() * 20}px ${3 + Math.random() * 6}px ${colors[0]}`;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.textContent = Math.random() > 0.7 ? symbols[Math.floor(Math.random() * symbols.length)] : '';
                el.style.fontSize = (6 + Math.random() * 10) + 'px';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                container.appendChild(el);
            }
        }
        createSparkles();

        // ============================================================
        // PROPOSAL FUNCTION
        // ============================================================
        function propose() {
            alert('💖 Yes! Goma said YES! 💖\n\n— Himal will love you forever and always! 🌼❤️');

            // Celebration burst
            const emojis = ['❤️', '💖', '💕', '💗', '💓', '💘', '🌸', '✨', '🌟', '🎉', '💝', '🌼', '🌻', '💐', '🎊', '🌺'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.style.position = 'fixed';
                    el.style.pointerEvents = 'none';
                    el.style.zIndex = '9999';
                    el.style.fontSize = (1.5 + Math.random() * 4.5) + 'rem';
                    el.style.left = (10 + Math.random() * 80) + '%';
                    el.style.top = (10 + Math.random() * 80) + '%';
                    el.style.transition = 'all 3.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.opacity = '1';
                    el.style.filter = 'drop-shadow(0 0 30px rgba(255,150,50,0.3))';
                    el.style.transform = 'scale(1) rotate(0deg)';
                    document.body.appendChild(el);

                    const tx = (Math.random() - 0.5) * 900;
                    const ty = -600 - Math.random() * 700;
                    const rot = (Math.random() - 0.5) * 720;
                    setTimeout(() => {
                        el.style.transform = `translate(${tx}px, ${ty}px) scale(0) rotate(${rot}deg)`;
                        el.style.opacity = '0';
                    }, 50);

                    setTimeout(() => el.remove(), 3500);
                }, i * 35);
            }
        }
    </script>
